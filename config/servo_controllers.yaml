controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_position_controller:
      type: position_controllers/JointGroupPositionController
      


joint_position_controller:
  ros__parameters:
    joints: [horizontal_joint, vertical_joint]
    command_interface: 
      - position


